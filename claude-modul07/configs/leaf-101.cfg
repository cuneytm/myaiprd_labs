!Command: show running-config
!Time: Fri Nov 20 02:00:00 2026
version 10.4(3) Bios:version 05.47
hostname LEAF-101

feature bgp
feature interface-vlan
feature lacp
feature vpc
feature nv overlay

username admin password 5 $5$KLMNOP$abcdefghijk role network-admin
snmp-server community S3cretRO group network-operator

ntp server 10.10.0.1 use-vrf management
ntp server 10.10.0.2 use-vrf management
logging server 10.10.0.5 6 use-vrf management

banner motd #Yetkisiz erisim yasaktir.#

vlan 2150
  name ATLAS-PROD
vlan 2151
  name ATLAS-DEV
vlan 2300
  name DENIZ-PROD

ip access-list MGMT-ERISIM
  10 permit tcp 10.10.0.0/24 any eq 22
  20 permit udp 10.10.0.0/24 any eq snmp
  30 deny ip any any log

interface loopback0
  ip address 10.255.0.101/32

interface Ethernet1/49
  description UPLINK-SPINE-01
  mtu 9216
  no switchport
  ip address 10.1.101.1/31
  no shutdown

interface Ethernet1/50
  description UPLINK-SPINE-02
  mtu 9216
  no switchport
  ip address 10.2.101.1/31
  no shutdown

interface Ethernet1/12
  description SRV-DB-07
  switchport access vlan 2150
  mtu 9216
  no shutdown

line vty
  access-class MGMT-ERISIM in
  exec-timeout 10

router bgp 65001
  router-id 10.255.0.101
  neighbor 10.0.0.1
    remote-as 65000
    description SPINE-01
    address-family l2vpn evpn
      send-community extended
  neighbor 10.0.0.2
    remote-as 65000
    description SPINE-02
    address-family l2vpn evpn
      send-community extended
